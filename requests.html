<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiguelVP | Requests</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body class="dark-body">
<nav class="navbar navbar-dark bg-dark fixed-top shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="index.html">MiguelVP</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="offcanvas offcanvas-end text-bg-dark" id="offcanvasNavbar">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title">Menu</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="requests.html">Requests</a></li>
          <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<main class="container mt-5 pt-5 text-light">
  <div class="text-center mb-5">
    <h1 class="fw-bold display-5">Let's Collaborate</h1>
    <p class="lead">Got an idea? Submit it below and I’ll get back to you shortly.</p>
  </div>

  <div class="mx-auto bg-dark rounded-4 p-4 shadow-lg" style="max-width: 600px;">
    <form id="form">
      <div class="mb-4">
        <label for="request" class="form-label">What would you like built?</label>
        <input type="text" class="form-control bg-secondary text-light border-0" id="request" name="request" required>
      </div>
      <div class="mb-4">
        <label for="name" class="form-label">Your Name</label>
        <input type="text" class="form-control bg-secondary text-light border-0" id="name" name="name" required>
      </div>
      <div class="mb-4">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control bg-secondary text-light border-0" id="email" name="email" required>
        <div class="form-text text-light">I’ll use this email to reply.</div>
      </div>
      <div class="text-center">
        <button onclick="sendEmail()" id="sendEmailButton" class="btn btn-outline-light w-100 py-2">
          Submit Request
        </button>
      </div>
    </form>
  </div>
</main>

<footer class="text-center py-4 text-light small mt-5">
  © 2025 MiguelVP. All rights reserved.
</footer>
<script src="netlify/functions/send-email.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
