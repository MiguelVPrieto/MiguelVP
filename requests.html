<form id="form">
  <div class="input-container">
    <input type="text" id="request" name="request" required="">
    <label for="request" class="label">Enter Request</label>
    <div class="underline"></div>
  </div>
  <div class="input-container">
    <input type="text" id="name" name="name" required="">
    <label for="name" class="label">Enter Name</label>
    <div class="underline"></div>
  </div>
  <div style="margin-bottom: 15px;" class="input-container">
    <input type="text" id="email" name="email" required="">
    <label for="email" class="label">Enter Email</label>
    <div class="underline"></div>
  </div>
  <label class="label1">I'm going to use this email to contact you.</label>
  <button style="margin-left: 890px" class="cssbuttons-io-button">
    Enviar
    <div class="icon">
      <svg
        height="24"
        width="24"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="M0 0h24v24H0z" fill="none"></path>
        <path
          d="M16.172 11l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2z"
          fill="currentColor"
        ></path>
      </svg>
    </div>
  </button>
</form>
<script>
  document.getElementById("sendButton").addEventListener("click", function (event) {
    event.preventDefault(); // Prevent the form from submitting normally
    emailjs
      .sendForm(
        "YOUR_SERVICE_ID",
        "YOUR_TEMPLATE_ID",
        document.getElementById("myForm")
      )
      .then(
        function () {
          alert("Email sent successfully!");
          // Clear form fields after successful submission
          document.getElementById("myForm").reset();
        },
        function (error) {
          alert("Email failed to send. Error: " + error);
        }
      );
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
